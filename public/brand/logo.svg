<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" fill="none">
  <style>
    .brand-title {
      font-family: "Didot", "Bodoni MT", "Cinzel", "Georgia", "Times New Roman", serif;
      font-weight: 600;
      letter-spacing: 0.32em;
      fill: #1E3524;
    }
    .brand-sub {
      font-family: "Didot", "Bodoni MT", "Cinzel", "Georgia", "Times New Roman", serif;
      font-weight: 500;
      letter-spacing: 0.42em;
      font-size: 11.5px;
      fill: #1E3524;
    }
  </style>

  <!-- Branch / Leaf Motif (Olive branch) -->
  <g stroke="#1E3524" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main curving stem -->
    <path d="M 104 46 C 112 40, 120 28, 126 12" />
    
    <!-- Top terminal leaf -->
    <path d="M 126 12 C 122 5, 128 3, 131 7 C 131 12, 128 14, 126 12 Z" fill="#1E3524" />
    
    <!-- Top right leaf -->
    <path d="M 124 20 C 132 17, 139 20, 142 25 C 136 26, 130 23, 124 20 Z" fill="#1E3524" />
    
    <!-- Middle left leaf -->
    <path d="M 117 26 C 109 23, 107 17, 112 15 C 117 18, 118 22, 117 26 Z" fill="#1E3524" />
    
    <!-- Lower right leaf -->
    <path d="M 116 33 C 123 35, 130 39, 131 43 C 125 43, 120 39, 116 33 Z" fill="#1E3524" />
    
    <!-- Lower left leaf -->
    <path d="M 110 39 C 103 40, 101 46, 105 48 C 108 47, 111 43, 110 39 Z" fill="#1E3524" />
  </g>

  <!-- Typography -->
  <text x="126" y="76" text-anchor="middle" class="brand-title" font-size="20">BRANCH</text>
  <text x="127" y="96" text-anchor="middle" class="brand-sub">CLO.</text>
</svg>
